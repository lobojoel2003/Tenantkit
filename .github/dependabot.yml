version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    ignore:
      # SvelteKit 3 supports TypeScript 6; move to 7 when SvelteKit does.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      # Types must match the Node.js version in .nvmrc (22).
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      svelte:
        patterns: ["svelte", "svelte-check", "@sveltejs/*", "vite", "vitest", "@vitest/*"]
      lint:
        patterns:
          [
            "eslint",
            "eslint-*",
            "@eslint/*",
            "typescript-eslint",
            "prettier",
            "prettier-*",
            "globals"
          ]
      testing:
        patterns: ["@playwright/test", "@axe-core/*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
