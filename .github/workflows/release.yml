name: Release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish, e.g. v1.0.0. If it doesn't exist yet, it's created on the latest commit of the branch you run this on."
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  release:
    name: Package and publish
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Find the commit to release
        run: |
          if git rev-parse -q --verify "refs/tags/$TAG" > /dev/null; then
            git checkout -q "refs/tags/$TAG"
            echo "TAG_EXISTS=true" >> "$GITHUB_ENV"
          else
            echo "Tag $TAG doesn't exist yet; it will be created on $(git rev-parse --short HEAD)."
            echo "TAG_EXISTS=false" >> "$GITHUB_ENV"
          fi
          echo "TARGET_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci

      - name: Check the tag matches package.json
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          if [ "v$VERSION" != "$TAG" ]; then
            echo "::error::Tag $TAG does not match package.json version $VERSION"
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "BUILD_NUMBER=$(git rev-list --count HEAD)" >> "$GITHUB_ENV"

      - name: Build the static site
        run: npm run build

      - name: Package release files
        run: bash scripts/package-release.sh "$VERSION"

      - name: Write release notes from CHANGELOG.md
        run: npm run --silent release:notes -- "$VERSION" > dist/RELEASE_NOTES.md

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            dist/*.zip
            dist/*.cdx.json

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PRERELEASE=""
          case "$VERSION" in *-*) PRERELEASE="--prerelease" ;; esac
          TITLE="Tenantkit v$VERSION (build $BUILD_NUMBER)"
          FILES=(dist/*.zip dist/*.cdx.json dist/SHA256SUMS.txt)
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release edit "$TAG" --title "$TITLE" --notes-file dist/RELEASE_NOTES.md
            gh release upload "$TAG" "${FILES[@]}" --clobber
          else
            VERIFY=""
            if [ "$TAG_EXISTS" = "true" ]; then VERIFY="--verify-tag"; fi
            gh release create "$TAG" "${FILES[@]}" --title "$TITLE" --notes-file dist/RELEASE_NOTES.md \
              --target "$TARGET_SHA" $VERIFY $PRERELEASE
          fi
          echo "Published $TITLE" >> "$GITHUB_STEP_SUMMARY"
