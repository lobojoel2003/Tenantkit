      en: Free guides and court forms for Texas renters, updated for the 2026 eviction rules, plus a directory of legal aid offices.
      es: Guías y formularios judiciales gratuitos para inquilinos de Texas, actualizados con las reglas de desalojo de 2026, y un directorio de oficinas de ayuda legal.
    topics: [eviction, repairs, deposit]
  - name: Texas RioGrande Legal Aid
    url: https://www.trla.org/
    phone: "1-888-988-9996"
    description:
      en: Free legal help for people with low incomes in Central, South and West Texas.
      es: Ayuda legal gratuita para personas de bajos ingresos en el centro, el sur y el oeste de Texas.
  - name: Lone Star Legal Aid
    url: https://www.lonestarlegal.org/
    phone: "1-800-733-8394"
    description:
      en: Free legal help for people with low incomes in East and Southeast Texas, including Houston.
      es: Ayuda legal gratuita para personas de bajos ingresos en el este y el sureste de Texas, incluido Houston.
  - name: Legal Aid of NorthWest Texas
    url: https://internet.lanwt.org/
    phone: "1-888-529-5277"
    description:
      en: Free legal help for people with low incomes in North and West Texas, including Dallas and Fort Worth.
      es: Ayuda legal gratuita para personas de bajos ingresos en el norte y el oeste de Texas, incluidos Dallas y Fort Worth.
  - name: Texas Tenant Advisor
    url: https://www.texastenant.org/
    description:
      en: Free self-help guides about tenant rights in Texas, such as repairs, deposits and lockouts.
      es: Guías gratuitas de autoayuda sobre los derechos de los inquilinos en Texas, como reparaciones, depósitos y cambios de cerradura.
    topics: [repairs, deposit]
sources:
  - label: TexasLawHelp.org, Eviction Answer and Defense Guide
    url: https://texaslawhelp.org/guide/eviction-answer-and-defense-guide
  - label: Texas Attorney General, Renters' Rights
    url: https://www.texasattorneygeneral.gov/consumer-protection/home-real-estate-and-travel/renters-rights
    note:
      en: May not yet reflect the eviction changes that took effect on January 1, 2026.
      es: Puede que aún no refleje los cambios en los desalojos que entraron en vigor el 1 de enero de 2026.
