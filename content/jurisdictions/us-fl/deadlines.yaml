        note:
          en: Your landlord may not retaliate against you for a good-faith complaint, for example by raising the rent, cutting services or threatening eviction.
          es: El arrendador no puede tomar represalias contra usted por una queja de buena fe, por ejemplo subiéndole la renta, quitándole servicios o amenazándole con un desalojo.
